<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #ddd; margin: 2em; }
    label { color: #999; margin-right: 0.5em; }
    select { margin-bottom: 1em; background: #222; color: #ddd; border: 1px solid #444; padding: 0.2em; }
    #status { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div>
    <label for="mic-select">Microphone:</label>
    <select id="mic-select"></select>
  </div>
  <div>
    <label for="speaker-select">Speakers:</label>
    <select id="speaker-select"></select>
  </div>
  <div>
    <label for="volume">Volume:</label>
    <input type="range" id="volume" min="0" max="200" value="100">
  </div>
  <div id="status">Connecting…</div>
  <audio id="output" autoplay></audio>
  <script src="app.js"></script>
</body>
</html>
