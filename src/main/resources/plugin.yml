name: $name
version: $version
main: $main
api-version: "$apiVersion"
authors:
  - andreypfau
  - nezushin
website: https://github.com/NezuShin/voice-bridge
description: Bridges proximity voice chat between Simple Voice Chat, Plasmo Voice, and a browser voice client
load: POSTWORLD
folia-supported: true

depend:
  - voicechat
  - PlasmoVoice

commands:
  voicebridge:
    description: Voice Web Bridge admin commands
    aliases: [vb, voicewebbridge, vwb]
  mic:
    description: Toggle web voice microphone On/Off

libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.3.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1
  - net.kyori:adventure-text-minimessage:4.23.0
  - net.kyori:adventure-text-serializer-gson:4.23.0
  - net.kyori:adventure-text-serializer-legacy:4.23.0

permissions:
  voicebridge.admin:
    description: Allows use of Voice Web Bridge admin commands
    default: op
